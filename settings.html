<div class="st-illustrator_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>ST Illustrator</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">

            <div class="flex-container flexFlowColumn wide100p">
                <label for="sti_enabled">启用配图</label>
                <label class="checkbox_label" for="sti_enabled">
                    <input id="sti_enabled" type="checkbox">
                    <span>启用</span>
                </label>

                <label for="sti_auto_mode">触发模式</label>
                <select id="sti_auto_mode" class="text_pole">
                    <option value="auto">自动</option>
                    <option value="manual">手动</option>
                </select>

                <label for="sti_min_interval">配图最小间隔（秒）</label>
                <input id="sti_min_interval" type="number" min="0" step="5" class="text_pole">
            </div>

            <hr>

            <h4>ComfyUI</h4>
            <div class="flex-container flexFlowColumn wide100p">
                <label for="sti_comfy_url">ComfyUI 地址</label>
                <input id="sti_comfy_url" type="text" class="text_pole">

                <label for="sti_workflow_file">工作流（从 ComfyUI 读取）</label>
                <select id="sti_workflow_file" class="text_pole">
                    <option value="">加载中...</option>
                </select>
                <div class="muted small">在 ComfyUI 里设计工作流，用 %prompt% / %negative_prompt% / %sampler% / %scheduler% 占位符标注插件要填的位置</div>

                <label for="sti_model_unet">UNET 模型（留空用工作流默认）</label>
                <input id="sti_model_unet" type="text" class="text_pole">

                <label for="sti_model_clip">CLIP 模型（留空用工作流默认）</label>
                <input id="sti_model_clip" type="text" class="text_pole">

                <label for="sti_model_vae">VAE 模型（留空用工作流默认）</label>
                <input id="sti_model_vae" type="text" class="text_pole">
            </div>

            <hr>

            <h4>提示词模板</h4>
            <div class="flex-container flexFlowColumn wide100p">
                <label for="sti_prompt_template">正面模板</label>
                <textarea id="sti_prompt_template" class="text_pole" rows="3"></textarea>
                <div class="muted small">可用素材占位符：{character} {appearance} {personality} {scenario} {scene}。生成规范（Anima/SD）完全由模板决定</div>

                <label for="sti_negative_template">负面模板</label>
                <textarea id="sti_negative_template" class="text_pole" rows="3"></textarea>
            </div>

            <hr>

            <h4>生成参数</h4>
            <div class="flex-container flexFlowColumn wide100p">
                <label for="sti_aspect_ratio">长宽比</label>
                <select id="sti_aspect_ratio" class="text_pole">
                    <option value="21:9">21:9 超宽</option>
                    <option value="2:1">2:1</option>
                    <option value="16:9">16:9</option>
                    <option value="16:10">16:10</option>
                    <option value="5:3">5:3</option>
                    <option value="3:2">3:2</option>
                    <option value="4:3">4:3</option>
                    <option value="1:1">1:1 方形</option>
                    <option value="3:4">3:4</option>
                    <option value="2:3">2:3</option>
                    <option value="3:5">3:5</option>
                    <option value="10:16">10:16</option>
                    <option value="9:16">9:16</option>
                    <option value="1:2">1:2</option>
                    <option value="9:21">9:21 超长竖</option>
                </select>

                <label for="sti_steps">步数</label>
                <input id="sti_steps" type="number" min="1" max="100" class="text_pole">

                <label for="sti_cfg">CFG</label>
                <input id="sti_cfg" type="number" min="0.5" max="15" step="0.5" class="text_pole">

                <label for="sti_seed">种子（-1 随机）</label>
                <input id="sti_seed" type="number" class="text_pole">

                <label for="sti_sampler_name">采样器</label>
                <select id="sti_sampler_name" class="text_pole">
                    <option value="er_sde">er_sde</option>
                    <option value="euler">euler</option>
                    <option value="euler_a">euler_a</option>
                    <option value="dpmpp_2m_sde">dpmpp_2m_sde</option>
                    <option value="dpmpp_2m_sde_gpu">dpmpp_2m_sde_gpu</option>
                </select>

                <label for="sti_scheduler">调度器</label>
                <select id="sti_scheduler" class="text_pole">
                    <option value="simple">simple</option>
                    <option value="beta57">beta57</option>
                    <option value="karras">karras</option>
                    <option value="normal">normal</option>
                </select>
            </div>

            <hr>

            <div class="flex-container wide100p">
                <button id="sti_test_generate" class="menu_button">测试生成</button>
                <button id="sti_manual_generate" class="menu_button">手动配图</button>
            </div>
            <div id="sti_status" class="muted"></div>

        </div>
    </div>
</div>
